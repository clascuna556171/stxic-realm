<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<title>realm-creator / square — Sovereign Architect Founder Frame</title>
<defs>
  <linearGradient id="rc-gold" x1="0" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#fff8cc"/>
    <stop offset="22%" stop-color="#f5d06e"/>
    <stop offset="48%" stop-color="#a46d22"/>
    <stop offset="74%" stop-color="#fed679"/>
    <stop offset="100%" stop-color="#694013"/>
  </linearGradient>
  <linearGradient id="rc-gold-light" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffe89a"/>
    <stop offset="50%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#ffd268"/>
  </linearGradient>
  <linearGradient id="rc-purple" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0%" stop-color="#55307e"/>
    <stop offset="35%" stop-color="#361a4f"/>
    <stop offset="75%" stop-color="#241038"/>
    <stop offset="100%" stop-color="#160824"/>
  </linearGradient>
  <linearGradient id="rc-astral-ring" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
    <stop offset="30%" stop-color="#ffd978" stop-opacity="0.85"/>
    <stop offset="70%" stop-color="#b488f2" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#4b2875" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Orbital Ring - Back Segment -->
<g opacity="0.85">
  <path d="M 195 48 C 234 50 250 72 250 98 C 250 118 240 136 222 148" fill="none" stroke="url(#rc-astral-ring)" stroke-width="4.5" stroke-linecap="round"/>
