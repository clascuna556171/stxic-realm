  <circle cx="128" cy="230" r="1.5" fill="#fff5cc"/>
</g>

<!-- Top Ornate Sovereign Crown -->
<g>
  <!-- Velvet Lining Under Crown -->
  <path d="M 103 40 Q 128 32 153 40 L 151 46 Q 128 38 105 46 Z" fill="#32174d" stroke="#160824" stroke-width="1.2"/>
  <!-- Crown Base Band -->
  <path d="M 100 42 Q 128 33 156 42 L 154 49 Q 128 40 102 49 Z" fill="url(#rc-gold)" stroke="#4a2a07" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 103 44 Q 128 35 153 44" fill="none" stroke="#fff5ca" stroke-width="1"/>
  <!-- Crown Spires -->
  <path d="M 102 42 L 105 24 L 115 36 L 128 12 L 141 36 L 151 24 L 154 42 Z" fill="url(#rc-gold)" stroke="#3d2105" stroke-width="2" stroke-linejoin="round"/>
  <!-- Crown Center Spire Facet & Star -->
  <path d="M 128 12 L 133 34 L 128 38 L 123 34 Z" fill="#fed679" stroke="#7a4812" stroke-width="1"/>
  <path d="M 128 14 V 38" stroke="#fff8cc" stroke-width="1.2"/>
  <!-- Top Finial Star -->
  <path d="M 128 4 L 131.5 10 L 138 12 L 131.5 14 L 128 20 L 124.5 14 L 118 12 L 124.5 10 Z" fill="#ffffff" stroke="url(#rc-gold)" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="128" cy="12" r="1.8" fill="#ffeebb"/>
  <!-- Side Spire Finials -->
  <circle cx="105" cy="24" r="2.5" fill="url(#rc-gold)" stroke="#4a2a07" stroke-width="1"/>
  <circle cx="151" cy="24" r="2.5" fill="url(#rc-gold)" stroke="#4a2a07" stroke-width="1"/>
  <circle cx="105" cy="24" r="1" fill="#ffffff"/>
  <circle cx="151" cy="24" r="1" fill="#ffffff"/>
</g>

<!-- Orbital Ring - Front Segment (Sweeping across bottom-left) -->
<g>
  <path d="M 16 138 C 10 158 22 182 48 196 C 70 208 98 214 116 216" fill="none" stroke="url(#rc-astral-ring)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 18 139 C 12 157 24 180 49 194 C 71 206 97 212 115 214" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <path d="M 26 132 C 22 142 24 154 34 164" fill="none" stroke="#fff2bf" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Sparkling Stardust Motes & 4-Point Stars -->
<g fill="#ffffff" stroke="url(#rc-gold)" stroke-width="0.8" stroke-linejoin="round">
  <!-- Top-Left Crown Sparkle -->
  <path d="M 98 26 L 100 30 L 104 31 L 100 32 L 98 36 L 96 32 L 92 31 L 96 30 Z"/>
  <circle cx="98" cy="31" r="0.8" fill="#fff5cc"/>
  <!-- Top-Far-Left Star -->
  <path d="M 84 38 L 85.5 41 L 89 42 L 85.5 43 L 84 46 L 82.5 43 L 79 42 L 82.5 41 Z"/>
  <!-- Left Shoulder Sparkle -->
  <path d="M 40 76 L 42.5 82 L 48 83.5 L 42.5 85 L 40 91 L 37.5 85 L 32 83.5 L 37.5 82 Z"/>
  <circle cx="40" cy="83.5" r="1.2" fill="#fff5cc"/>
  <!-- Orbit Loop Sparkle (Bottom Left) -->
  <path d="M 32 150 L 34 154 L 38 155.5 L 34 157 L 32 161 L 30 157 L 26 155.5 L 30 154 Z"/>
  <!-- Right Flank Sparkle -->
  <path d="M 226 132 L 228.5 137 L 233 138.5 L 228.5 140 L 226 145 L 223.5 140 L 219 138.5 L 223.5 137 Z"/>
  <circle cx="226" cy="138.5" r="1" fill="#fff5cc"/>
  <!-- Right Upper Comet Mote -->
  <path d="M 218 78 L 219.5 81 L 223 82 L 219.5 83 L 218 86 L 216.5 83 L 213 82 L 216.5 81 Z"/>
</g>
</svg>
