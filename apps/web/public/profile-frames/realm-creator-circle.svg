  <path d="M 199 97 H 205 Q 208.5 97 208.5 101 Q 208.5 105 205 105 H 202 M 202 97 V 113 M 205 105 L 208.5 113" fill="none" stroke="url(#rc-gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 200 97.5 H 204.5" stroke="#fff5ca" stroke-width="0.8"/>
  <!-- Clasp Bracket -->
  <rect x="189" y="58" width="28" height="6" rx="1.5" fill="url(#rc-gold)" stroke="#3d2105" stroke-width="1.2"/>
  <circle cx="203" cy="61" r="1.5" fill="#ffffff"/>
</g>

<!-- Golden Laurel Leaves Garland - Left Arc -->
<g fill="url(#rc-gold)" stroke="#4d2f0a" stroke-width="1" stroke-linejoin="round">
  <path d="M 68 168 Q 60 162 58 152 Q 68 156 72 165 Z"/>
  <path d="M 72 172 Q 62 170 56 160 Q 67 163 74 170 Z"/>
  <path d="M 78 184 Q 68 180 64 170 Q 75 174 81 181 Z"/>
  <path d="M 82 188 Q 72 188 66 178 Q 77 181 84 186 Z"/>
  <path d="M 90 200 Q 80 198 74 190 Q 85 192 92 198 Z"/>
  <path d="M 96 205 Q 86 206 79 198 Q 90 200 98 203 Z"/>
  <path d="M 104 214 Q 94 214 88 206 Q 98 207 106 212 Z"/>
  <path d="M 112 219 Q 102 222 96 215 Q 106 215 114 218 Z"/>
</g>

<!-- Golden Laurel Leaves Garland - Right Arc -->
<g fill="url(#rc-gold)" stroke="#4d2f0a" stroke-width="1" stroke-linejoin="round">
  <path d="M 188 168 Q 196 162 198 152 Q 188 156 184 165 Z"/>
  <path d="M 184 172 Q 194 170 200 160 Q 189 163 182 170 Z"/>
  <path d="M 178 184 Q 188 180 192 170 Q 181 174 175 181 Z"/>
  <path d="M 174 188 Q 184 188 190 178 Q 179 181 172 186 Z"/>
  <path d="M 166 200 Q 176 198 182 190 Q 171 192 164 198 Z"/>
  <path d="M 160 205 Q 170 206 177 198 Q 166 200 158 203 Z"/>
  <path d="M 152 214 Q 162 214 168 206 Q 158 207 150 212 Z"/>
  <path d="M 144 219 Q 154 222 160 215 Q 150 215 142 218 Z"/>
</g>

<!-- Bottom Central Heraldic Shield Crest -->
<g>
  <!-- Shield Body -->
  <path d="M 114 212 H 142 V 226 Q 142 242 128 250 Q 114 242 114 226 Z" fill="url(#rc-purple)" stroke="#231406" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M 114 212 H 142 V 226 Q 142 242 128 250 Q 114 242 114 226 Z" fill="url(#rc-purple)" stroke="url(#rc-gold)" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 117 215 H 139 V 225 Q 139 238 128 245 Q 117 238 117 225 Z" fill="#381d54" stroke="#68398f" stroke-width="0.8"/>
