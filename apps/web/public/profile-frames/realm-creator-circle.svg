<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<title>realm-creator / circle — Sovereign Architect Founder Frame</title>
<defs>
  <linearGradient id="rc-gold" x1="0" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#fff8cc"/>
    <stop offset="22%" stop-color="#f5d06e"/>
    <stop offset="48%" stop-color="#a46d22"/>
    <stop offset="74%" stop-color="#fed679"/>
    <stop offset="100%" stop-color="#694013"/>
  </linearGradient>
  <linearGradient id="rc-gold-light" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffe89a"/>
    <stop offset="50%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#ffd268"/>
  </linearGradient>
  <linearGradient id="rc-purple" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0%" stop-color="#55307e"/>
    <stop offset="35%" stop-color="#361a4f"/>
    <stop offset="75%" stop-color="#241038"/>
    <stop offset="100%" stop-color="#160824"/>
  </linearGradient>
  <linearGradient id="rc-astral-ring" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
    <stop offset="30%" stop-color="#ffd978" stop-opacity="0.85"/>
    <stop offset="70%" stop-color="#b488f2" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#4b2875" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Orbital Ring - Back Segment -->
<g opacity="0.85">
  <path d="M 195 62 C 225 65 244 82 244 98 C 244 110 236 122 224 132" fill="none" stroke="url(#rc-astral-ring)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 198 60 C 228 63 246 80 246 98 C 246 112 238 124 226 134" fill="none" stroke="#fff4cf" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
</g>

<!-- Base Circular Laurel Rim -->
<path d="M 128 28 a 100 100 0 1 1 0 200 a 100 100 0 1 1 0 -200" fill="none" stroke="#231406" stroke-width="14" stroke-linejoin="round"/>
<path d="M 128 28 a 100 100 0 1 1 0 200 a 100 100 0 1 1 0 -200" fill="none" stroke="url(#rc-gold)" stroke-width="8" stroke-linejoin="round"/>
<path d="M 128 34 a 94 94 0 1 1 0 188 a 94 94 0 1 1 0 -188" fill="none" stroke="#fff0ab" stroke-width="1.2" stroke-linejoin="round"/>
<path d="M 128 22 a 106 106 0 1 1 0 212 a 106 106 0 1 1 0 -212" fill="none" stroke="#7a4b17" stroke-width="1.5" stroke-linejoin="round"/>

<!-- Left Royal Purple Heraldic Banner -->
<g>
  <path d="M 42 62 L 64 62 L 64 165 L 53 154 L 42 165 Z" fill="url(#rc-purple)" stroke="#160824" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 46 62 L 46 159" stroke="#6f4296" stroke-width="1" stroke-linecap="round"/>
  <path d="M 60 62 L 60 159" stroke="#251236" stroke-width="1" stroke-linecap="round"/>
  <!-- Gold Embroidered Monogram 'R' -->
  <path d="M 49 97 H 55 Q 58.5 97 58.5 101 Q 58.5 105 55 105 H 52 M 52 97 V 113 M 55 105 L 58.5 113" fill="none" stroke="url(#rc-gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 50 97.5 H 54.5" stroke="#fff5ca" stroke-width="0.8"/>
  <!-- Clasp Bracket -->
  <rect x="39" y="58" width="28" height="6" rx="1.5" fill="url(#rc-gold)" stroke="#3d2105" stroke-width="1.2"/>
  <circle cx="53" cy="61" r="1.5" fill="#ffffff"/>
</g>

<!-- Right Royal Purple Heraldic Banner -->
<g>
  <path d="M 192 62 L 214 62 L 214 165 L 203 154 L 192 165 Z" fill="url(#rc-purple)" stroke="#160824" stroke-width="1.5" stroke-linejoin="round"/>
